# Caffeine Tracker — example scripts
#
# Paste a script via Settings -> Automations & Scenes -> Scripts -> + Add Script
# -> ⋮ -> Edit in YAML, or add these to your scripts.yaml.
#
# Find your device ID: Settings -> Devices & Services -> Caffeine Tracker ->
# open the person's device; the ID is the last part of the URL.
# Replace YOUR_DEVICE_ID below with it.

# One reusable script for every drink. Call it from buttons, voice assistants
# or automations, and pick the person, amount and drink each time.
log_caffeine:
  alias: Log caffeine
  icon: mdi:coffee
  mode: queued
  fields:
    person:
      name: Person
      required: true
      selector:
        device:
          integration: caffeine_tracker
    mg:
      name: Amount
      required: true
      default: 80
      selector:
        number:
          min: 1
          max: 500
          step: 1
          unit_of_measurement: mg
    label:
      name: Drink
      default: Espresso
      selector:
        text:
  sequence:
    - action: caffeine_tracker.log_consumption
      target:
        device_id: "{{ person }}"
      data:
        mg: "{{ mg }}"
        label: "{{ label | default('custom') }}"

# One-tap shortcuts that reuse the script above. Typical caffeine amounts;
# adjust to match your own drinks.
caffeine_espresso:
  alias: Espresso
  icon: mdi:coffee
  sequence:
    - action: script.log_caffeine
      data:
        person: YOUR_DEVICE_ID
        mg: 80
        label: Espresso

caffeine_filter_coffee:
  alias: Filter coffee
  icon: mdi:coffee-maker
  sequence:
    - action: script.log_caffeine
      data:
        person: YOUR_DEVICE_ID
        mg: 95
        label: Filter coffee

caffeine_cold_brew:
  alias: Cold brew
  icon: mdi:cup
  sequence:
    - action: script.log_caffeine
      data:
        person: YOUR_DEVICE_ID
        mg: 155
        label: Cold brew

caffeine_energy_drink:
  alias: Energy drink
  icon: mdi:lightning-bolt
  sequence:
    - action: script.log_caffeine
      data:
        person: YOUR_DEVICE_ID
        mg: 160
        label: Energy drink

caffeine_undo:
  alias: Undo last caffeine
  icon: mdi:undo
  sequence:
    - action: caffeine_tracker.remove_last_consumption
      target:
        device_id: YOUR_DEVICE_ID
