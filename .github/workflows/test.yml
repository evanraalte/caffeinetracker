name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
      - run: uv sync --group dev
      - run: uv run ruff check custom_components tests
      - run: uv run ruff format --check custom_components tests
      - run: uv run pyright custom_components

  test:
    name: Test (HA ${{ matrix.ha-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ha-version:
          - "2024.6.0"
          - "stable"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.12"
      - run: uv sync --group dev
      - name: Pin HA version
        if: matrix.ha-version != 'stable'
        run: |
          uv pip install "homeassistant==${{ matrix.ha-version }}"
      - run: uv run pytest --cov=custom_components/caffeine_tracker --cov-report=xml
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6
        if: matrix.ha-version == 'stable'
        with:
          files: ./coverage.xml

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: home-assistant/actions/hassfest@a7c616ce81ccda50150bf1595786c71b1883fabb # master

  hacs:
    name: HACS Action
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration
